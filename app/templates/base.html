<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Open Kitchen</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* ── Navbar ────────────────────────────────────────────── */
        nav {
            background: #7aa7f0; /* lighter cornflower blue */
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center; /* center title */
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); /* shadow under navbar */
        }

        /* ── Title ────────────────────────────────────────────── */
        nav a.brand {
            color: #5e8fdd; /* slightly darker than navbar for subtle contrast */
            text-decoration: none;
            font-weight: bold;
            font-size: 2rem; /* bigger title */
            text-align: center;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.5); /* only bottom-right shadow */
        }

        /* ── Nav buttons ──────────────────────────────────────── */
        .nav-buttons {
            position: absolute; /* keep buttons on right */
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-nav, .btn-search {
            background: #E07B39;
            color: white;
            padding: 7px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        /* ── Search Bar ───────────────────────────────────────── */
        #search-bar {
            display: none; /* hidden by default */
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 5px;
            background: white;
            padding: 5px;
            border-radius: 6px;
            display: flex;
            gap: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #search-bar input[type="text"] {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            min-width: 200px;
        }
        #search-bar input[type="submit"] {
            background: #E07B39;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 860px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
    </style>

    <script>
        function toggleSearch() {
            const bar = document.getElementById('search-bar');
            if (bar.style.display === 'flex') {
                bar.style.display = 'none';
            } else {
                bar.style.display = 'flex';
                bar.querySelector('input[name="q"]').focus();
            }
        }
    </script>
</head>
<body>
<nav>
    <a class="brand" href="{{ url_for('dashboard') }}">The Open Kitchen</a>
    <div class="nav-buttons">
        <a class="btn-nav" href="{{ url_for('create_recipe') }}">+ Create Recipe</a>
        <button class="btn-search" onclick="toggleSearch()">Search</button>

        <!-- Search form inside navbar, hidden by default -->
        <form id="search-bar" method="GET" action="{{ url_for('search') }}">
            <input type="text" name="q" placeholder="Search recipes..." value="{{ query|default('') }}">
            <input type="submit" value="Go">
        </form>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
