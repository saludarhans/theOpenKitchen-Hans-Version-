{% extends "base.html" %}

{% block content %}
<!DOCTYPE html>
<html>

	<head>
		<title> CSC330 Flask template demo </title>
	</head>
	<table>
		<h1 style=color:red>City populations </h1>
		<tr>
			<th>City</th>
			<th>Country</th>
			<th>Population</th>

		</tr>
		{% for city in cities %}
		<tr>
			<td>{{city.name}}</td>
			<td>{{city.country}}</td>
			<td>{{city.population}}</td>
		</tr>
		{% endfor %}
	</table>
</html>

{% endblock %}
